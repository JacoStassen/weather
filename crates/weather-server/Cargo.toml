[package]
name = "weather-server"
description = "Local REST API and MCP server for the weather dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
weather-core.workspace = true
anyhow = "1"
chrono.workspace = true
futures = "0.3"
rmcp = { version = "3.11", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait.workspace = true
rmcp = { version = "3.11", features = ["client"] }
